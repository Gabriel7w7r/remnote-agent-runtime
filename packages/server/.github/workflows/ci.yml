name: Code Quality & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    uses: robert7/workflows/.github/workflows/node-ci.yml@v0.4.0
    with:
      node_versions: '["22.13.0", "24"]'
      coverage_node_version: '24'
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
